<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tazivo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html{padding-top:env(safe-area-inset-top,0px);background:#0B1530}</style>
<title>Tazivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column. Week strip + day summary + habits by time of day. Four tabs: Today, Stats, Badges, Settings. Sheets slide up for details, forms, timer and plans. */
:root{
  --bg:#F6F8FA; --surface:#FFFFFF; --surface2:#E7EDF1; --fg:#0B1530; --muted:#59647A; --line:#DCE3EA;
  --accent:#087B7D; --on-accent:#FFFFFF; --flame:#D9730D; --good:#2A9157; --on-flame:#FFFFFF; --lime:#C6FF3E;
  --violet:#5B5FD6; --sky:#2A8FD2; --amber:#D97A1E; --green:#2F9A5C; --rose:#DE4F67; --on-c:#FFFFFF;
  --shadow:0 1px 2px rgba(11,21,48,.05),0 8px 20px rgba(11,21,48,.06);
  --scrim:rgba(14,14,32,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1530; --surface:#121D3D; --surface2:#1B2850; --fg:#EAF1F7; --muted:#9AA8C2; --line:#22305A;
    --accent:#00C7C3; --on-accent:#0B1530; --flame:#F2A04A; --good:#C6FF3E; --on-flame:#0B1530;
    --violet:#8E92FF; --sky:#55B4F0; --amber:#F2A456; --green:#4CC57D; --rose:#F07489; --on-c:#0B1530;
    --shadow:0 1px 2px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1530; --surface:#121D3D; --surface2:#1B2850; --fg:#EAF1F7; --muted:#9AA8C2; --line:#22305A;
  --accent:#00C7C3; --on-accent:#0B1530; --flame:#F2A04A; --good:#C6FF3E; --on-flame:#0B1530;
  --violet:#8E92FF; --sky:#55B4F0; --amber:#F2A456; --green:#4CC57D; --rose:#F07489; --on-c:#0B1530;
  --shadow:0 1px 2px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);margin:0}
#app{--f-display:'Manrope','Segoe UI',system-ui,sans-serif;--f-body:'Manrope','Segoe UI',system-ui,sans-serif;font:15px/1.55 var(--f-body);-webkit-text-size-adjust:100%;min-height:100vh}
#app[lang="ar"]{--f-display:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;--f-body:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{display:block;flex:none}
.ic.solid{fill:currentColor}

.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px 112px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px}
.brand{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1.15;display:flex;align-items:flex-start;gap:3px}
.bdot{width:9px;height:9px;border-radius:50%;background:#C6FF3E;margin-top:7px;flex:none}
.tagline{color:var(--muted);font-size:11.5px;letter-spacing:.2em;text-align:center;margin:14px 0 0;font-weight:600}
.dateline{color:var(--muted);font-size:13.5px;margin-top:2px}
.addbtn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.top>div{min-width:0}

/* week strip */
.weekbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.wlabel{font-weight:600;font-size:14px}
.nav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 6px;border-radius:18px;min-width:0}
.day.sel{background:var(--surface);box-shadow:0 0 0 1.5px var(--accent)}
.day.future{opacity:.45}
.dl{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.dc svg{position:absolute;inset:0}
.dc b{position:relative;font-family:var(--f-display);font-weight:600;font-size:14px}
.day.full .dc{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.tdot{width:4px;height:4px;border-radius:50%;background:transparent}
.tdot.on{background:var(--accent)}

/* summary */
.summary{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sring{position:relative;width:64px;height:64px;flex:none;display:grid;place-items:center}
.sring svg{position:absolute;inset:0}
.sring span{position:relative;font-family:var(--f-display);font-weight:600;font-size:15px}
.sbody{min-width:0;flex:1}
.sbody h2{font-size:16px;font-weight:600}
.sbody p{color:var(--muted);font-size:13.5px;margin-top:2px}
.sbody .chip{margin-top:8px}
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:16px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.demo button{color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;text-align:end}

/* habits */
.slot{margin-bottom:18px}
.slot h2{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);margin:0 4px 8px}
.list{display:flex;flex-direction:column;gap:10px}
.habit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow)}
.habit.skipped{opacity:.7}
.habit.paused{box-shadow:none;opacity:.8}
.h-ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c)}
.h-body{display:flex;flex-direction:column;gap:6px;text-align:start;min-width:0}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.h-title{font-weight:600;overflow-wrap:anywhere}
.streak{display:inline-flex;align-items:center;gap:3px;color:var(--flame);font-size:12.5px;font-weight:600;flex:none}
.h-sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted)}
.tag.due{background:color-mix(in srgb,var(--rose) 16%,var(--surface));color:var(--rose)}
.track{height:6px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,var(--surface2));overflow:hidden;display:block}
.pf{height:100%;background:var(--c);border-radius:99px;transition:width .35s ease;display:block}
.act{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--c);border:2px solid color-mix(in srgb,var(--c) 55%,transparent)}
.act.on{background:var(--c);border-color:var(--c);color:var(--on-c)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:22px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty p{color:var(--muted);max-width:34ch}
.qs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* chips, cards */
.chip{padding:6px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:14px;font-weight:600}
.card .hint{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .wd{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-family:var(--f-display);font-weight:500;font-size:12.5px;background:color-mix(in srgb,var(--c) calc(var(--p) * 1%),var(--surface2));color:var(--fg)}
.cell.hi{color:var(--on-c)}
.cell.off{background:transparent;color:var(--muted);opacity:.5}
.cell.future{opacity:.35}
.cell.today{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--fg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.tile small{display:block;color:var(--muted);font-size:12.5px}
.tile b{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.5}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px}
.bt{width:100%;height:84px;border-radius:7px;background:var(--surface2);display:flex;align-items:flex-end;overflow:hidden}
.bf{width:100%;background:var(--c);border-radius:7px}
.bar small{font-size:10px;color:var(--muted)}
.bar.today small{color:var(--fg);font-weight:600}
.note{color:var(--muted);font-size:12.5px;margin:-4px 4px 14px}
.review p{font-size:14px;margin-top:6px}
.review .big{font-family:var(--f-display);font-size:15px;font-weight:600}
.review .m{color:var(--muted)}

/* achievements */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12.5px;color:var(--muted)}
.hex{width:78px;height:86px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.badge.on{color:var(--fg);font-weight:500}
.badge.on .hex{background:var(--flame);color:var(--on-flame)}
.badge.goal.on .hex{background:var(--good);color:var(--on-flame)}
.section-title{font-size:14px;font-weight:600;margin:4px 4px 12px}

/* settings */
.group{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.group>h2{font-size:12.5px;font-weight:600;color:var(--muted);padding:14px 16px 4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px}
.row+.row{border-top:1px solid var(--line)}
.row .lbl{min-width:0}
.row .lbl b{display:block;font-weight:600;font-size:14.5px}
.row .lbl small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.row select{width:auto;max-width:55%;padding:8px 12px;font-size:14px}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn2{padding:9px 14px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:13.5px}
.btn2.danger{color:var(--rose)}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;cursor:pointer;margin:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.sw:checked{background:var(--accent);border-color:var(--accent)}
.sw:checked::after{background:var(--on-accent);transform:translateX(18px)}
#app[dir="rtl"] .sw:checked::after{transform:translateX(-18px)}
details.rest summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--accent);list-style:none}
details.rest summary::-webkit-details-marker{display:none}
details.rest textarea{margin-top:10px}
.priv{color:var(--muted);font-size:12.5px;text-align:center;margin:6px 8px 0}
.planline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);font-weight:600;font-size:12.5px}

/* plans */
.plan{border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.plan.cur{border-color:var(--accent)}
.plan.best{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.plan-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.plan-h h3{font-family:var(--f-display);font-size:18px;font-weight:600}
.price{font-family:var(--f-display);font-size:20px;font-weight:700}
.price small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12.5px;margin-inline-start:4px}
.plan ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.plan li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.plan li svg{color:var(--good);margin-top:3px}
.plan .tag{margin-inline-start:4px}
.plan .primary{margin-top:12px}
.plan .p2{margin-top:6px;font-size:13px;color:var(--muted)}
.limitmsg{background:color-mix(in srgb,var(--rose) 10%,var(--surface));border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.demo-note{font-size:12.5px;color:var(--muted);text-align:center;margin:2px 8px 6px}

/* tabs, toast */
.tabs{position:fixed;inset-inline:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:11.5px;color:var(--muted);min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.toast{position:fixed;inset-inline:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:min(400px,calc(100vw - 32px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{font-weight:700;text-decoration:underline;text-underline-offset:3px;color:inherit;white-space:nowrap}

/* sheets */
.ov{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.s-head h2{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.3}
.s-head p{color:var(--muted);font-size:13.5px}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.primary{width:100%;padding:14px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px}
.primary.soft{background:var(--surface2);color:var(--fg)}
.ghost{width:100%;padding:12px;border-radius:16px;color:var(--muted);font-weight:500;margin-top:6px}
.rb{padding:10px 18px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;min-width:56px}
.tring{position:relative;width:min(250px,68vw);aspect-ratio:1;margin:6px auto 14px;display:grid;place-items:center}
.tring svg{position:absolute;inset:0;width:100%;height:100%}
.tnum{position:relative;text-align:center}
#t-time{display:block;font-family:var(--f-display);font-size:48px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
#t-note{color:var(--muted);font-size:13px}
.trow{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stats2 div{background:var(--surface2);border-radius:16px;padding:10px 14px}
.stats2 small{display:block;color:var(--muted);font-size:12px}
.stats2 b{font-family:var(--f-display);font-size:20px;font-weight:600}
.mini7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.md{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);min-width:0}
.md span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md i{width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface2));display:grid;place-items:center;color:var(--on-c)}
.md i.d{background:var(--c)}
.md i.s{background:var(--surface2);color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sv{text-align:center}
.sv b{font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1.2;display:block}
.sv small{color:var(--muted);font-size:13px}
.hintline{color:var(--muted);font-size:12.5px;margin:6px 4px 12px;text-align:center}
.arow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.arow button{flex:1 1 0;min-width:96px;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border-radius:14px;background:var(--surface2);font-weight:600;font-size:13.5px}
.arow .danger{color:var(--rose)}
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;background:color-mix(in srgb,var(--rose) 10%,var(--surface));border-radius:14px;font-size:14px}
.confirm span{flex:1 1 100%}
.confirm .danger-fill{background:var(--rose);color:var(--on-c);padding:8px 18px;border-radius:99px;font-weight:600}
.confirm .keep{padding:8px 14px;color:var(--muted)}

/* form */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field>legend{font-size:13px;font-weight:600;color:var(--muted)}
fieldset{border:0;padding:0;margin:0 0 14px;min-width:0}
fieldset legend{padding:0;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=time],select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
textarea{resize:vertical;min-height:72px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface2);padding:4px;border-radius:14px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.seg span{display:block;text-align:center;padding:9px 4px;border-radius:11px;font-size:14px;font-weight:500}
.seg input:checked+span{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.seg input:disabled+span{opacity:.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:12px}
.swatches label{position:relative;width:36px;height:36px}
.swatches input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.swatches span{display:block;width:100%;height:100%;border-radius:50%;background:var(--c)}
.swatches input:checked+span{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.swatches input:focus-visible+span{outline:2px solid var(--fg);outline-offset:3px}
.dchips{display:flex;gap:6px;flex-wrap:wrap}
.dchips label{position:relative}
.dchips input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.dchips span{display:block;padding:7px 12px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:500}
.dchips input:checked+span{background:var(--accent);color:var(--on-accent);font-weight:600}
.dchips input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:16px}
.chk input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.fhint{font-size:12.5px;color:var(--muted);margin-top:-2px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- data ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
const goalOf=h=>h.type==='time'?h.target*60:(h.type==='count'?h.target:1);
function mkHabit(k,id,created){
  const tp_=TPL.find(x=>x.k===k);
  return {id:id,key:k,type:tp_.type,target:tp_.target||1,ukey:tp_.u,slot:tp_.slot,color:tp_.color,kind:tp_.quit?'quit':'build',created:created,days:null,remind:'',pauses:[]};
}
function detectLang(){const n=((navigator.language||'en')+'').slice(0,2).toLowerCase();return LOC[n]?n:'en';}
function freshSettings(l){return {lang:l,week:'auto',hijri:l==='ar',forgive:true,theme:'auto',pro:false};}
function seed(l){
  const r=rng(7),tt=new Date(),created=ds(addDays(tt,-45));
  const keys=['meditate','language','water','walk','read','nosugar'];
  const habits=keys.map((k,i)=>mkHabit(k,'h'+(i+1),created));
  habits.find(h=>h.key==='read').days=[0,1,2,3,4];
  const probs={meditate:.88,language:.8,water:.85,walk:.7,read:.7,nosugar:.78},log={},skip={};
  habits.forEach(h=>{
    log[h.id]={};skip[h.id]={};
    const g=goalOf(h);
    for(let i=1;i<=44;i++){
      const d=addDays(tt,-i),k=ds(d);
      if(h.days&&h.days.indexOf(d.getDay())<0)continue;
      const force=(h.key==='meditate'&&i<=4)||(h.key==='water'&&i<=9);
      if(force||r()<probs[h.key])log[h.id][k]=g;
      else if(h.type!=='check'&&r()<.4)log[h.id][k]=Math.max(1,Math.round(g*(.3+r()*.4)));
    }
  });
  const walk=habits.find(h=>h.key==='walk');
  delete log[walk.id][ds(addDays(tt,-3))];skip[walk.id][ds(addDays(tt,-3))]=true;
  const tk=ds(tt);log.h3[tk]=3;log.h2[tk]=600;
  return {v:2,habits:habits,log:log,skip:skip,notes:{},settings:freshSettings(l),demo:true};
}
const validShape=o=>o&&Array.isArray(o.habits)&&o.log&&typeof o.log==='object';
function fix(o){
  const st=Object.assign(freshSettings('en'),o.settings||{});

  if(st.week!=='auto'&&!(Number(st.week)>=0&&Number(st.week)<=6))st.week='auto';
  if(['auto','light','dark'].indexOf(st.theme)<0)st.theme='auto';
  const habits=o.habits.filter(h=>h&&typeof h.id==='string').map(h=>({
    id:h.id,key:(typeof h.key==='string'&&TPL.some(x=>x.k===h.key))?h.key:undefined,
    name:typeof h.name==='string'?h.name.slice(0,60):undefined,
    type:['check','count','time'].indexOf(h.type)>-1?h.type:'check',
    target:Math.max(1,Math.min(999,Number(h.target)||1)),
    unit:typeof h.unit==='string'?h.unit.slice(0,20):undefined,
    ukey:['cup','page','prayer','times'].indexOf(h.ukey)>-1?h.ukey:undefined,
    slot:SLOTS.indexOf(h.slot)>-1?h.slot:'morning',
    color:COLORS.indexOf(h.color)>-1?h.color:'violet',
    kind:h.kind==='quit'?'quit':'build',
    created:/^\d{4}-\d{2}-\d{2}$/.test(h.created||'')?h.created:todayStr(),
    days:(Array.isArray(h.days)&&h.days.length&&h.days.length<7)?h.days.filter(x=>x>=0&&x<=6):null,
    remind:/^\d{2}:\d{2}$/.test(h.remind||'')?h.remind:'',
    pauses:Array.isArray(h.pauses)?h.pauses.filter(p=>Array.isArray(p)&&typeof p[0]==='string'):[]
  }));
  return {v:2,habits:habits,log:o.log||{},skip:o.skip||{},notes:o.notes||{},settings:st,demo:!!o.demo};
}

/* ---------- habit logic ---------- */
const hb=id=>S.habits.find(h=>h.id===id);
const nameOf=h=>h.name||(h.key?t('tpl_'+h.key):'—');
const unitOf=h=>h.unit||(h.ukey?t('u_'+h.ukey):t('u_times'));
const val=(h,k)=>(S.log[h.id]&&S.log[h.id][k])||0;
const ratio=(h,k)=>Math.min(1,val(h,k)/goalOf(h));
const isDone=(h,k)=>val(h,k)>=goalOf(h);
const isSkip=(h,k)=>!!(S.skip[h.id]&&S.skip[h.id][k]);
const isPaused=(h,k)=>(h.pauses||[]).some(p=>k>=p[0]&&(!p[1]||k<p[1]));
const sched=(h,k)=>!h.days||h.days.indexOf(fromDs(k).getDay())>-1;
function st(h,k){
  if(k<h.created||isPaused(h,k))return 'off';
  if(isDone(h,k))return 'done';
  if(isSkip(h,k))return 'skip';
  return sched(h,k)?'miss':'off';
}
const visible=(h,k)=>k>=h.created&&!isPaused(h,k)&&(sched(h,k)||val(h,k)>0||isSkip(h,k));
function dayFrac(k,f){
  let sum=0,c=0;
  S.habits.forEach(h=>{
    if(f!=='all'&&h.id!==f)return;
    const s=st(h,k);if(s==='off'||s==='skip')return;
    sum+=ratio(h,k);c++;
  });
  return c?sum/c:null;
}
function streakNow(h){
  let d=fromDs(todayStr()),c=0,lastF=null;
  for(let i=0;i<1200;i++){
    const k=ds(d);if(k<h.created)break;
    const s=st(h,k);
    if(s==='done')c++;
    else if(s==='miss'){
      if(i===0){/* today is not over yet */}
      else if(S.settings.forgive&&(lastF===null||i-lastF>=7))lastF=i;
      else break;
    }
    d=addDays(d,-1);
  }
  return c;
}
function bestStreak(h){
  const today=todayStr();
  let d=fromDs(h.created),c=0,best=0,lastF=null,idx=0;
  while(ds(d)<=today&&idx<4000){
    const k=ds(d),s=st(h,k);
    if(s==='done'){c++;if(c>best)best=c;}
    else if(s==='miss'&&k!==today){
      if(S.settings.forgive&&(lastF===null||idx-lastF>=7))lastF=idx;
      else{c=0;lastF=null;}
    }
    d=addDays(d,1);idx++;
  }
  return Math.max(best,streakNow(h));
}
const doneKeys=h=>Object.keys(S.log[h.id]||{}).filter(k=>isDone(h,k));
const bestAll=()=>S.habits.reduce((a,h)=>Math.max(a,bestStreak(h)),0);
const curAll=()=>S.habits.reduce((a,h)=>Math.max(a,streakNow(h)),0);
const totalDone=()=>S.habits.reduce((a,h)=>a+doneKeys(h).length,0);
function statsFor(f){
  const hs=f==='all'?S.habits:S.habits.filter(h=>h.id===f);
  let cur=0,best=0,total=0;
  hs.forEach(h=>{cur=Math.max(cur,streakNow(h));best=Math.max(best,bestStreak(h));total+=doneKeys(h).length;});
  let sum=0,cnt=0;const t0=fromDs(todayStr());
  for(let i=0;i<30;i++){const fr=dayFrac(ds(addDays(t0,-i)),f);if(fr!=null){sum+=fr;cnt++;}}
  return {cur:cur,best:best,total:total,rate:cnt?Math.round(sum/cnt*100):0};
}
const activeCount=()=>S.habits.filter(h=>!isPaused(h,todayStr())).length;
const isPro=()=>!!S.settings.pro;
function weekAvg(from,to){let s=0,c=0;const t0=fromDs(todayStr());for(let i=from;i<=to;i++){const f=dayFrac(ds(addDays(t0,-i)),'all');if(f!=null){s+=f;c++;}}return c?{avg:s/c*100,n:c}:null;}
function review(){
  const a=weekAvg(0,6),b=weekAvg(7,13);
  if(!a)return null;
  const t0=fromDs(todayStr());
  const per=S.habits.map(h=>{let s=0,c=0;for(let i=0;i<7;i++){const k=ds(addDays(t0,-i)),x=st(h,k);if(x==='off'||x==='skip')continue;s+=ratio(h,k);c++;}return {h:h,r:c?s/c:null,c:c};}).filter(x=>x.r!==null&&x.c>=3);
  per.sort((x,y)=>y.r-x.r);
  return {a:a.avg,delta:b?Math.round(a.avg-b.avg):null,best:per.length>1?per[0]:null,weak:per.length>1&&per[per.length-1].r<per[0].r?per[per.length-1]:null};
}

let T=null,tm=null,toastT=null,undoData=null,lastFocus=null;

function applyLang(){
  lang=S.settings.lang;
  const a=$('#app');a.lang=lang;a.dir=rtl()?'rtl':'ltr';
  document.title=t('brand');
  const th=S.settings.theme,root=document.documentElement;
  if(th==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',th);
  mkFmt();
}
function weekStartOf(d){return addDays(d,-dayIdx(d));}
function weekOffsetFor(k){return Math.round((weekStartOf(fromDs(k))-weekStartOf(fromDs(todayStr())))/(7*864e5));}

function setVal(h,k,v,quiet){
  const prev=val(h,k),was=isDone(h,k),bBefore=quiet?0:bestAll();
  S.log[h.id]=S.log[h.id]||{};
  if(v<=0)delete S.log[h.id][k];else S.log[h.id][k]=v;
  if(isDone(h,k)&&S.skip[h.id])delete S.skip[h.id][k];
  save();
  const nowDone=isDone(h,k);
  refresh();
  if(quiet)return;
  const bAfter=bestAll();
  const crossed=STREAK_MARKS.filter(m=>bBefore<m&&bAfter>=m).pop();
  if(crossed)toast(t('t_badge',tp('p_day',crossed)));
  else if(!was&&nowDone)toast(t('t_nice',nameOf(h)),{hid:h.id,k:k,prev:prev});
}
function toast(m,undo){
  const el=$('#toast');$('#toast-t').textContent=m;
  const ub=$('#toast-u');undoData=undo||null;
  if(undo){ub.hidden=false;ub.textContent=t('t_undo');}else ub.hidden=true;
  el.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>{el.classList.remove('show');undoData=null;},undo?4500:2400);
}

/* ---------- views ---------- */
function topHTML(){

}
function tabsHTML(){
  const defs=[['today','today','nav_today'],['stats','stats','nav_stats'],['ach','flame','nav_ach'],['set','gear','nav_set']];
  defs.forEach(d=>{const b=$('#tab-'+d[0]);b.innerHTML=ic(d[1],22)+'<span>'+esc(t(d[2]))+'</span>';b.setAttribute('aria-current',ui.tab===d[0]?'page':'false');});
}
function schedLabel(h){
  if(!h.days)return t('sched_every');
  return h.days.slice().sort((a,b)=>((a-wsDay()+7)%7)-((b-wsDay()+7)%7)).map(w=>wdName(w,'short')).join(', ');
}
function habitSub(h,v,extra){
  const g=goalOf(h),parts=[esc(schedLabel(h))];
  if(h.type==='count')parts.push(esc(t('sub_cnt',nf(v),nf(g),unitOf(h))));
  else if(h.type==='time')parts.push(esc(t('sub_time',nf(Math.floor(v/60)),nf(h.target))));
  else if(h.kind==='quit')parts.push(esc(t('sub_quit')));
  let s=parts.join(' · ');
  return s+(extra||'');
}
function habitCard(h){
  const k=ui.sel,v=val(h,k),p=ratio(h,k),done=isDone(h,k),skip=isSkip(h,k)&&!done,s=streakNow(h);
  const due=k===todayStr()&&h.remind&&!done&&!skip&&nowHM()>=h.remind;
  const icon=h.kind==='quit'?'ban':(h.type==='time'?'clock':(h.type==='count'?'hash':'checksq'));
  const nm=esc(nameOf(h));
  let act;
  if(h.type==='check')act='<button class="act'+(done?' on':'')+'" data-act="toggle" data-hid="'+h.id+'" aria-pressed="'+done+'" aria-label="'+nm+'">'+ic('check',22)+'</button>';
  else if(h.type==='count')act='<button class="act'+(done?' on':'')+'" data-act="inc" data-hid="'+h.id+'" aria-label="+1 '+nm+'">'+ic(done?'check':'plus',22)+'</button>';
  else act='<button class="act'+(done?' on':'')+'" data-act="timer" data-hid="'+h.id+'" aria-label="'+esc(t('d_timer'))+': '+nm+'">'+(done?ic('check',22):ic('play',20))+'</button>';
  let extra='';
  if(skip)extra+=' <span class="tag">'+ic('skip',11)+esc(t('skipped_chip'))+'</span>';
  if(due)extra+=' <span class="tag due">'+ic('bell',11)+esc(t('due_chip',h.remind))+'</span>';
  return '<article class="habit'+(skip?' skipped':'')+'" style="--c:var(--'+h.color+')"><div class="h-ico">'+ic(icon,22)+'</div>'
    +'<button class="h-body" data-act="detail" data-hid="'+h.id+'"><span class="h-row"><span class="h-title">'+nm+'</span>'
    +(s>0?'<span class="streak">'+ic('flame',15,true)+nf(s)+'</span>':'')+'</span>'
    +'<span class="h-sub">'+habitSub(h,v,extra)+'</span><span class="track"><span class="pf" style="width:'+Math.round(p*100)+'%"></span></span></button>'
    +act+'</article>';
}
function pausedCard(h){
  return '<article class="habit paused" style="--c:var(--'+h.color+')"><div class="h-ico">'+ic('pause',22)+'</div><div class="h-body"><span class="h-title">'+esc(nameOf(h))+'</span><span class="h-sub">'+esc(t('d_paused'))+'</span></div><button class="chip" data-act="pause" data-hid="'+h.id+'">'+esc(t('d_resume'))+'</button></article>';

function quickChips(){

function todayView(){
  const t0=todayStr(),sel=ui.sel,ws=addDays(weekStartOf(fromDs(t0)),ui.week*7);
  let h='<div class="weekbar"><button class="nav" data-act="wprev" aria-label="'+esc(t('nav_prev'))+'">'+icPrev(20)+'</button><span class="wlabel">'+esc(monthYear(addDays(ws,3)))+'</span><button class="nav" data-act="wnext" aria-label="'+esc(t('nav_next'))+'"'+(ui.week>=0?' disabled':'')+'>'+icNext(20)+'</button></div><div class="strip">';
  for(let i=0;i<7;i++){
    const d=addDays(ws,i),k=ds(d),f=dayFrac(k,'all'),fut=k>t0;
    h+='<button class="day'+(k===sel?' sel':'')+(fut?' future':'')+(f!=null&&f>=1?' full':'')+'" data-act="day" data-d="'+k+'"'+(fut?' disabled':'')+' aria-pressed="'+(k===sel)+'" aria-label="'+esc(fmtLong(d))+'"><span class="dl">'+esc(d.toLocaleDateString(loc(),{weekday:'short'}))+'</span><span class="dc">'+ring(f||0,38,3.5)+'<b>'+nf(d.getDate())+'</b></span><i class="tdot'+(k===t0?' on':'')+'"></i></button>';
  }
  h+='</div>';
  const hs=S.habits.filter(x=>visible(x,sel));
  const rel=hs.filter(x=>st(x,sel)!=='skip'&&st(x,sel)!=='off');
  const done=rel.filter(x=>isDone(x,sel)).length,fr=dayFrac(sel,'all')||0,cur=curAll();
  let msg;
  if(!hs.length)msg=t('no_habits_day');
  else if(rel.length&&done===rel.length)msg=t('all_done');
  else msg=t('progress',nf(done),nf(rel.length),nf(rel.length-done));
  h+='<section class="summary"><div class="sring">'+ring(fr,64,6)+'<span>'+esc(pct(Math.round(fr*100)))+'</span></div><div class="sbody"><h2>'+esc(sel===t0?t('today'):fmtLong(fromDs(sel)))+'</h2><p>'+esc(msg)+'</p>'
    +(cur>0&&sel===t0?'<p>'+esc(t('best_now',tp('p_day',cur)))+'</p>':'')
    +(sel!==t0?'<button class="chip" data-act="wtoday">'+esc(t('back_today'))+'</button>':'')+'</div></section>';
  if(S.demo)h+='<div class="demo"><span>'+esc(t('demo_note'))+'</span><button data-act="reset">'+esc(t('demo_reset'))+'</button></div>';
  if(!S.habits.length){
    h+='<div class="empty"><p>'+esc(t('empty_none'))+'</p>'+quickChips()+'<button class="addbtn" data-act="add">'+ic('plus',18)+'<span>'+esc(t('add_first'))+'</span></button></div>';
  }else if(!hs.length&&!S.habits.some(x=>x.created<=sel)){
    h+='<div class="empty"><p>'+esc(t('empty_before'))+'</p></div>';
  }else{
    SLOTS.forEach(sl=>{
      const list=hs.filter(x=>x.slot===sl);if(!list.length)return;
      const dn=list.filter(x=>isDone(x,sel)).length;
      h+='<section class="slot"><h2><span>'+esc(t('slot_'+sl))+'</span><span>'+nf(dn)+'/'+nf(list.length)+'</span></h2><div class="list">'+list.map(habitCard).join('')+'</div></section>';
    });
    if(sel===t0){
      const ps=S.habits.filter(x=>isPaused(x,t0));
      if(ps.length)h+='<section class="slot"><h2><span>'+esc(t('d_paused'))+'</span><span>'+nf(ps.length)+'</span></h2><div class="list">'+ps.map(pausedCard).join('')+'</div></section>';
    }
  }
  return h;
}

  return h;

/* ---------- sheets ---------- */
function openSheet(html,kind){
  lastFocus=document.activeElement;
  ui.sheet=kind;$('#sh').innerHTML=html;$('#ov').hidden=false;
  try{$('#sh').focus({preventScroll:true});}catch(e){}
}
function closeSheet(){
  if(ui.sheet==='timer')saveTimer();

  ui.sheet=null;ui.detail=null;ui.confirmDel=null;ui.form=null;
  $('#ov').hidden=true;$('#sh').innerHTML='';

const head=(title,sub)=>'<div class="grab"></div><div class="s-head"><div><h2>'+esc(title)+'</h2>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div><button class="x" data-act="close" type="button" aria-label="'+esc(t('cancel'))+'">'+ic('x',18)+'</button></div>';

function detailHTML(id){
  const h=hb(id);if(!h)return '';
  const k=ui.sel,t0=todayStr(),v=val(h,k),g=goalOf(h),done=isDone(h,k),skip=isSkip(h,k)&&!done,paused=isPaused(h,t0);
  const q=h.kind==='quit';

/* timer */
function openTimer(id){
  const h=hb(id);if(!h)return;
  const rem=Math.max(0,goalOf(h)-val(h,ui.sel));
  const total=Math.min(7200,Math.max(60,Math.ceil((rem>0?rem:goalOf(h))/60)*60));
  T={id:id,total:total,left:total,running:false,endAt:0,saved:0,finished:false};
  const r=100,c=(2*Math.PI*r).toFixed(2);
  openSheet(head(nameOf(h),t('tm_goal',nf(h.target)))
    +'<div style="--c:var(--'+h.color+')"><div class="tring"><svg viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="'+r+'" fill="none" stroke="color-mix(in srgb,var(--c) 18%,var(--surface2))" stroke-width="14"/><circle id="t-arc" cx="120" cy="120" r="'+r+'" fill="none" stroke="var(--c)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="0" transform="rotate(-90 120 120)"/></svg><div class="tnum"><span id="t-time" dir="ltr"></span><span id="t-note"></span></div></div>'
    +'<div class="trow"><button class="rb" data-act="tminus">'+esc(t('tm_minus'))+'</button><button class="rb" data-act="tplus">'+esc(t('tm_plus'))+'</button></div></div>'
    +'<button class="primary" id="t-main" data-act="tmain"></button><button class="ghost" data-act="close">'+esc(t('tm_save'))+'</button>','timer');
  T.circ=2*Math.PI*r;
  paintTimer();
}
function paintTimer(){
  if(!T)return;
  const tEl=$('#t-time');if(!tEl)return;
  const secs=Math.ceil(T.left),mm=Math.floor(secs/60),ss=secs%60;
  tEl.textContent=two(mm)+':'+two(ss);
  $('#t-arc').setAttribute('stroke-dashoffset',(T.circ*(1-T.left/T.total)).toFixed(2));
  $('#t-note').textContent=T.finished?t('tm_over'):(T.running?t('tm_run'):t('tm_len',nf(Math.round(T.total/60))));
  $('#t-main').textContent=T.finished?t('tm_finish'):(T.running?t('tm_pause'):(T.total-T.left>0?t('tm_resume'):t('tm_start')));
}
function tick(){
  if(!T||!T.running)return;
  T.left=Math.max(0,(T.endAt-Date.now())/1000);
  if(T.left<=0){
    T.running=false;T.finished=true;clearInterval(tm);tm=null;saveTimer();
    try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
  }
  paintTimer();
}
function saveTimer(){
  if(!T)return;
  const el=Math.floor(T.total-T.left),delta=el-T.saved,h=hb(T.id);
  if(h&&delta>=1){T.saved=el;setVal(h,ui.sel,val(h,ui.sel)+delta);}
}
function tAdjust(d){
  if(!T||T.finished)return;
  const nt=T.total+d,nl=T.left+d;
  if(nt<60||nl<60)return;
  T.total=nt;T.left=nl;if(T.running)T.endAt+=d*1000;
  paintTimer();
}
function tMain(){
  if(!T)return;
  if(T.finished){closeSheet();return;}
  if(T.running){T.left=Math.max(0,(T.endAt-Date.now())/1000);T.running=false;clearInterval(tm);tm=null;}
  else{T.endAt=Date.now()+T.left*1000;T.running=true;clearInterval(tm);tm=setInterval(tick,250);}
  paintTimer();
}

function submitForm(){
  const f=$('#addf'),name=$('#f-name').value.trim();

  const editId=f.dataset.edit,h=editId?hb(editId):null;
  const quit=$('#f-quit')?$('#f-quit').checked:(h?h.kind==='quit':false);
  const typeEl=f.querySelector('input[name=type]:checked');
  const type=h?h.type:(quit?'check':(typeEl?typeEl.value:'check'));
  let target=parseInt($('#f-target').value,10);
  if(!(target>0))target=type==='time'?10:5;
  target=Math.min(target,999);
  let days=Array.prototype.map.call(f.querySelectorAll('input[name=day]:checked'),x=>Number(x.value));
  if(days.length===0||days.length===7)days=null;
  const unitTxt=$('#f-unit').value.trim();
  const data={slot:$('#f-slot').value,color:f.querySelector('input[name=color]:checked').value,days:days,remind:$('#f-remind').value||''};

    if(h.key&&name===t('tpl_'+h.key)){}else{h.name=name;delete h.key;}
    if(type==='count'){
      if(h.ukey&&unitTxt===t('u_'+h.ukey)){}else{h.unit=unitTxt||t('u_times');delete h.ukey;}
    }
    save();closeSheet();toast(t('t_saved'));return;

  closeSheet();toast(t('t_added',name));

/* backup */
const backupText=()=>JSON.stringify({app:'tazivo',version:2,exportedAt:new Date().toISOString(),data:S});
async function exportFile(name,text){
  let d=null;
  try{d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){d=null;}
  if(d){
    try{await d.save({filename:name,data:text});return;}
    catch(e){if(e&&e.code==='declined')return;}
  }
  try{
    const b=new Blob([text],{type:'text/plain'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);
    toast(t('x_export'));
  }catch(e){showText(text);toast(t('x_copyfail'));}
}
function csvCell(c){let s=String(c);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function csvText(){
  const rows=[['habit','type','date','value','goal','skipped','note']];
  S.habits.forEach(h=>{
    const set={};[S.log[h.id],S.skip[h.id],S.notes[h.id]].forEach(o=>Object.keys(o||{}).forEach(k=>{set[k]=1;}));
    Object.keys(set).sort().forEach(k=>rows.push([nameOf(h),h.type==='time'?'seconds':h.type,k,val(h,k),goalOf(h),isSkip(h,k)?1:0,(S.notes[h.id]||{})[k]||'']));
  });
  return rows.map(r=>r.map(csvCell).join(',')).join('\n');
}
function importText(txt){
  let o;try{o=JSON.parse(txt);}catch(e){toast(t('x_bad'));return;}
  const d=o&&o.data?o.data:o;
  if(!validShape(d)){toast(t('x_bad'));return;}
  S=fix(d);save();applyLang();render();toast(t('x_imported'));
}
function showText(txt){
  const r=$('#rest'),ta=$('#rtext');
  if(r&&ta){r.open=true;ta.value=txt;ta.focus();ta.select();}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target===$('#ov')){closeSheet();return;}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act,h=el.dataset.hid?hb(el.dataset.hid):null;
  switch(a){
    case 'tab':ui.tab=el.dataset.tab;ui.confirmWipe=false;render();window.scrollTo(0,0);break;
    case 'day':ui.sel=el.dataset.d;render();break;
    case 'calday':ui.sel=el.dataset.d;ui.week=weekOffsetFor(el.dataset.d);ui.tab='today';render();window.scrollTo(0,0);break;
    case 'wprev':ui.week--;render();break;
    case 'wnext':if(ui.week<0){ui.week++;render();}break;
    case 'wtoday':ui.week=0;ui.sel=todayStr();render();break;
    case 'mprev':ui.sm.m--;if(ui.sm.m<0){ui.sm.m=11;ui.sm.y--;}render();break;
    case 'mnext':{const n0=new Date();if(ui.sm.y<n0.getFullYear()||ui.sm.m<n0.getMonth()){ui.sm.m++;if(ui.sm.m>11){ui.sm.m=0;ui.sm.y++;}render();}break;}
    case 'sf':ui.f=el.dataset.f;render();break;
    case 'add':if(tryAdd())openForm(null);break;
    case 'edit':if(h)openForm(h.id);break;
    case 'tpladd':addFromTpl(Number(el.dataset.i));break;
    case 'tplfill':fillFromTpl(Number(el.dataset.i));break;
    case 'close':closeSheet();break;
    case 'detail':if(h)openDetail(h.id);break;
    case 'toggle':if(h)setVal(h,ui.sel,isDone(h,ui.sel)?0:1);break;
    case 'inc':if(h)setVal(h,ui.sel,val(h,ui.sel)+1);break;
    case 'dec':if(h)setVal(h,ui.sel,Math.max(0,val(h,ui.sel)-1));break;
    case 'tm5':if(h)setVal(h,ui.sel,Math.max(0,val(h,ui.sel)-300));break;
    case 'tp5':if(h)setVal(h,ui.sel,val(h,ui.sel)+300);break;
    case 'timer':if(h){if(ui.sheet)closeSheet();openTimer(h.id);}break;
    case 'tminus':tAdjust(-300);break;
    case 'tplus':tAdjust(300);break;
    case 'tmain':tMain();break;
    case 'skip':if(h){S.skip[h.id]=S.skip[h.id]||{};if(isSkip(h,ui.sel))delete S.skip[h.id][ui.sel];else S.skip[h.id][ui.sel]=true;save();refresh();}break;
    case 'pause':if(h){const open=(h.pauses||[]).find(p=>!p[1]);h.pauses=h.pauses||[];if(open)open[1]=todayStr();else h.pauses.push([todayStr(),null]);save();refresh();}break;
    case 'del':ui.confirmDel=el.dataset.hid;refresh();break;
    case 'delno':ui.confirmDel=null;refresh();break;
    case 'delok':
      S.habits=S.habits.filter(x=>x.id!==el.dataset.hid);delete S.log[el.dataset.hid];delete S.skip[el.dataset.hid];delete S.notes[el.dataset.hid];
      if(ui.f===el.dataset.hid)ui.f='all';
      save();closeSheet();toast(t('t_deleted'));break;
    case 'reset':S.habits=[];S.log={};S.skip={};S.notes={};S.demo=false;ui.f='all';save();render();break;
    case 'undo':if(undoData){const u=undoData,hh=hb(u.hid);undoData=null;$('#toast').classList.remove('show');if(hh)setVal(hh,u.k,u.prev,true);}break;
    case 'plans':openPlans();break;
    case 'unlock':S.settings.pro=true;save();openPlans();render();break;
    case 'relock':S.settings.pro=false;save();openPlans();render();break;
    case 'xjson':exportFile('tazivo-backup.json',backupText());break;
    case 'xcsv':exportFile('tazivo-habits.csv',csvText());break;
    case 'xcopy':{
      const txt=backupText();
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(t('x_copied')),()=>{showText(txt);toast(t('x_copyfail'));});
      break;}
    case 'xfile':$('#imp').click();break;
    case 'xrestore':{const ta=$('#rtext');if(ta&&ta.value.trim())importText(ta.value);break;}
    case 'wipe':ui.confirmWipe=true;render();break;
    case 'wipeno':ui.confirmWipe=false;render();break;
    case 'wipeok':S={v:2,habits:[],log:{},skip:{},notes:{},settings:S.settings,demo:false};ui.confirmWipe=false;ui.f='all';save();render();toast(t('x_wiped'));break;
  }
});

    save();render();return;
  }
  if(el.id==='imp'&&el.files&&el.files[0]){
    const rd=new FileReader();rd.onload=()=>importText(String(rd.result||''));rd.readAsText(el.files[0]);el.value='';return;
  }
  if(el.closest&&el.closest('#addf'))updateAddForm();
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='note'){
    const h=hb(el.dataset.hid);if(!h)return;
    S.notes[h.id]=S.notes[h.id]||{};
    const v=el.value.slice(0,500);
    if(v.trim())S.notes[h.id][el.dataset.k]=v;else delete S.notes[h.id][el.dataset.k];
    save();
  }
});
document.addEventListener('submit',e=>{if(e.target.id==='addf'){e.preventDefault();submitForm();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet();});

applyLang();
render();

})();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body></html>
